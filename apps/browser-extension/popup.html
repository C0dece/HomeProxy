<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeProxy Browser</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="ext-header between">
      <div class="flex">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8.25" fill="#16161A" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
          <path d="M8 16H13.5L17.5 10.5H24" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.5 16L17.5 21.5H24" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="8" cy="16" r="2" fill="#F4F4F5"/>
          <circle cx="24" cy="10.5" r="1.8" fill="#F4F4F5"/>
          <circle cx="24" cy="21.5" r="1.8" fill="#10B981"/>
        </svg>
        <strong class="brand-name">HomeProxy</strong>
      </div>
      <div class="flex">
        <span class="signal-bars offline" id="status">
          <span class="signal-dot"></span>
          <span id="status-text">Загрузка</span>
        </span>
        <button type="button" class="icon-btn" id="view-toggle" title="Настройки" aria-label="Настройки">⚙</button>
      </div>
    </header>

    <main class="ext-main stack">
      <p class="notice warning" role="status" id="notice" hidden></p>
      <p class="notice" id="update-banner" hidden></p>

      <!-- Экран 1: Главный экран -->
      <section id="view-home" class="stack">
        <div class="stack mode-wrap">
          <span class="micro-label">Общий режим</span>
          <div class="hp-segmented three-cols">
            <button type="button" id="rm-off">Выкл</button>
            <button type="button" id="rm-auto">Авто</button>
            <button type="button" id="rm-all">Весь трафик</button>
          </div>
          <div class="base-bar between" id="base-route-bar" hidden>
            <span class="muted">Основной трафик:</span>
            <div class="hp-segmented two-cols mini">
              <button type="button" id="base-direct">Прямой</button>
              <button type="button" id="base-proxy">Через прокси</button>
            </div>
          </div>
        </div>

        <form class="hp-card stack" id="connect" hidden>
          <span class="card-subtitle">Подключение к серверу</span>
          <input id="link" type="password" class="mono" placeholder="Ссылка HomeProxy или sing-box" required autocomplete="off">
          <button class="primary" type="submit">Подключить</button>
        </form>

        <section class="hp-card stack site-card" id="route" hidden>
          <div class="between">
            <div class="card-head min-0">
              <span class="micro-label">Текущая страница</span>
              <div class="domain-title mono" id="domain"></div>
            </div>
            <span class="mode-pill" id="mode-pill">Агент</span>
          </div>

          <div class="hp-segmented four-cols" role="group" aria-label="Маршрут для текущей страницы">
            <button type="button" id="sr-auto">Авто</button>
            <button type="button" id="sr-proxy">Прокси</button>
            <button type="button" id="sr-direct">Прямой</button>
            <button type="button" id="sr-block">Блок</button>
          </div>

          <button type="button" class="site-all-btn" id="quick-site">Весь сайт + внешние (0)</button>
        </section>
      </section>

      <!-- Экран 2: Настройки -->
      <section id="view-settings" class="stack" hidden>
        <div class="hp-segmented two-cols">
          <button type="button" id="mode-agent">С агентом</button>
          <button type="button" id="mode-standalone">Автономный</button>
        </div>

        <div class="hp-card stack" id="agent-panel">
          <div class="agent-state" id="agent-state-line">
            <span class="dot"></span>
            <span id="agent-state-text">Ожидание локального ПК-агента</span>
          </div>
          <form class="between port-row" id="port-form">
            <span class="row-label">Локальный порт</span>
            <div class="flex">
              <input id="agent-port" type="number" min="1024" max="65531" value="17770" class="mono port-field" required>
              <button type="submit" class="small" id="save-port">ОК</button>
            </div>
          </form>
          <div class="flex">
            <button type="button" class="small flex-1" id="sync" hidden>Синхронизировать</button>
            <button type="button" class="small ghost danger" id="forget" hidden>Отвязать</button>
          </div>
          <form class="stack" id="settings-connect" hidden>
            <input id="settings-link" type="password" class="mono" placeholder="Ссылка HomeProxy или sing-box" required autocomplete="off">
            <button type="submit" class="small">Подключить по ссылке</button>
          </form>
        </div>

        <div class="stack" id="standalone-panel" hidden>
          <form class="hp-card stack" id="sa-form">
            <div class="proto-grid">
              <select id="sa-scheme">
                <option value="https">HTTPS</option>
                <option value="socks5">SOCKS5</option>
                <option value="http">HTTP</option>
              </select>
              <input id="sa-host" class="mono" placeholder="Сервер" required>
            </div>
            <div class="field-row">
              <input id="sa-port" type="number" min="1" max="65535" value="8443" class="mono" placeholder="Порт" required>
              <input id="sa-user" class="mono" autocomplete="off" placeholder="Логин">
            </div>
            <div class="pass-box">
              <input id="sa-pass" type="password" class="mono" autocomplete="new-password" placeholder="Пароль прокси">
              <button type="button" class="eye-toggle" id="sa-pass-toggle" aria-label="Показать пароль">👁</button>
            </div>
            <button type="submit" class="primary" id="sa-save">Сохранить</button>
          </form>

          <div class="hp-card flush" id="sa-rules-box">
            <div class="card-head-bar between">
              <span>Список сайтов</span>
              <span class="mono muted" id="local-count">0</span>
            </div>
            <div class="rules-list" id="local-rules"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
