<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeProxy Browser</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="between"><div class="flex"><img src="icon.png" width="32" height="32" alt=""><strong>HomeProxy</strong></div><span class="badge" id="status">Загрузка</span></header>
    <main class="stack">
      <p class="notice warning" role="status" id="notice" hidden></p>
      <form class="card stack" id="connect" hidden>
        <h1>Подключить браузер</h1>
        <label>Персональная ссылка <input id="link" type="password" placeholder="https://…/connect#…" required autocomplete="off"></label>
        <button class="primary" type="submit">Подключить</button>
      </form>
      <section class="card stack" id="route" hidden>
        <div class="between"><h2 id="domain"></h2><span class="label mono" id="revision"></span></div>
        <p class="label" id="current"></p>
        <div class="field-row">
          <label>Область <select id="scope"><option>LOCAL</option><option>PERSONAL</option></select></label>
          <label>Маршрут <select id="action"><option value="PROXY">PROXY</option><option value="LOCAL_DIRECT">DIRECT</option><option value="AUTO">AUTO</option><option value="BLOCK">BLOCK</option><option value="SERVER_DIRECT">SERVER DIRECT</option><option value="INHERIT">Наследовать</option></select></label>
        </div>
        <label class="check"><input type="checkbox" id="subdomains"> Включить поддомены</label>
        <details id="details">
          <summary>Ресурсы вкладки <span class="muted" id="count"></span></summary>
          <p class="muted">Выбранные домены получают отдельные правила для всех вкладок.</p>
          <div class="stack" id="resources"></div>
        </details>
        <button class="primary" id="save">Сохранить правило</button>
      </section>
      <section class="card stack" id="agent" hidden>
        <h2>HomeProxy Agent</h2>
        <p class="label">Для маршрутизации запустите Agent на этом ПК и подключите его отдельной ссылкой того же пользователя.</p>
        <div class="flex">
          <button class="small" id="toggle"></button>
          <button class="small" id="sync">Синхронизировать</button>
          <button class="small ghost danger" id="forget">Отвязать</button>
        </div>
      </section>
    </main>
  </body>
</html>
