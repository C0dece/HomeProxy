[package]
name = "homeproxy-agent"
version = "0.1.1"
edition = "2021"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
url = { version = "2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hickory-proto = { version = "0.25.2", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Rpc", "Win32_System_SystemInformation", "Win32_System_Threading"] }
