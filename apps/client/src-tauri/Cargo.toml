[package]
name = "homeproxy-desktop"
version = "0.1.1"
edition = "2021"

[lib]
name = "homeproxy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
homeproxy-agent = { path = "../controller" }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "=2.14.1"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ring = "0.17.14"
